services:
  caelestis:
    image: ${CAELESTIS_IMAGE:-miacx/caelestis:local}
    build:
      context: .
      args:
        CAELESTIS_BUILD_ID: ${CAELESTIS_BUILD_ID:-development}
    restart: unless-stopped
    stop_grace_period: 35s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: ${CAELESTIS_ENV_FILE:-.env}
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env before starting Caelestis}
      HOST: 0.0.0.0
      PORT: '3000'
      DATA_DIRECTORY: /data
      REPLICAS: '1'
    ports:
      - '${CAELESTIS_BIND_ADDRESS:-127.0.0.1}:${CAELESTIS_HTTP_PORT:-3000}:3000'
    volumes:
      - data:/data
    tmpfs:
      - /tmp

volumes:
  data:
