name = "wplace-template-server"
main = "src/worker.ts"
compatibility_date = "2026-08-03"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "wts-blobs"

[[d1_databases]]
binding = "DB"
database_name = "wts"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "TELEMETRY"
class_name = "TelemetryShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryShard"]

[vars]
SHARD_STRATEGY = "single"
