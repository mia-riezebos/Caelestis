name = "wplace-template-server"
main = "src/worker.ts"
compatibility_date = "2026-08-03"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "caelestis-blobs"

[[d1_databases]]
binding = "DB"
database_name = "caelestis"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./migrations"

[[durable_objects.bindings]]
name = "TELEMETRY"
class_name = "TelemetryShard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryShard"]

[vars]
SHARD_STRATEGY = "single"
SERVER_ID = "00000000-0000-7000-8000-000000000000"
SERVER_NAME = "Template Server"
SERVER_DESCRIPTION = "A self-hosted wplace template server"
# The canvas season this deployment serves. /manifest is season-scoped and ServerInfo carries no
# season, so a server running anything but 1 has to say so here or it answers with season 1's.
SEASON = "1"
# "true" serves the read surface without a token and makes /server advertise auth: 'none'.
OPEN_ACCESS = "false"

[observability]
enabled = true
