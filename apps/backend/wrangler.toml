name = "caelestis-backend"
main = "src/worker.ts"
account_id = "492214885e7a580ccc1d141dfdb4dc5f"
compatibility_date = "2026-08-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[routes]]
pattern = "caelestis.mia.cx/backend/*"
zone_name = "mia.cx"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "caelestis-blobs"

[[d1_databases]]
binding = "DB"
database_name = "caelestis"
database_id = "53a57050-6d18-4466-980d-f5e51e416c04"
migrations_dir = "./migrations"

[[durable_objects.bindings]]
name = "TELEMETRY"
class_name = "TelemetryShard"

[[durable_objects.bindings]]
name = "ALARM_WATCHER"
class_name = "AlarmWatcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TelemetryShard"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AlarmWatcher"]

[vars]
SHARD_STRATEGY = "single"
SERVER_ID = "01a03930-4f7d-7e72-aa07-666380bf60f7"
SERVER_NAME = "Caelestis"
SERVER_DESCRIPTION = "The official Caelestis template server"
# The canvas season this deployment serves. /manifest is season-scoped and ServerInfo carries no
# season, so a later-season server has to say so here or it answers with season 0's.
SEASON = "0"
# "true" serves the read surface without a token and makes /server advertise auth: 'none'.
OPEN_ACCESS = "true"
# Mount the runtime adapter here while keeping the portable Hono app root-relative.
BASE_PATH = "/backend"
# The first production rollout only inventories candidates. Change this only after its logs have
# been reviewed; `delete` enables fenced physical R2 reclamation.
TILE_BLOB_GC_MODE = "dry-run"
# CI overrides these with the userscript version and deployment commit. Local builds stay bounded.
USERSCRIPT_BUILD_ID = "development"
FRONTEND_BUILD_ID = "development"

[observability]
enabled = true

# The server's own tile mirror: every 6 hours it refetches the tiles templates live on plus a
# one-tile ring of surroundings, so timelapses keep moving and the frontend viewer has real canvas
# context even when no userscript user has passed over the area.
[triggers]
crons = ["0 */6 * * *"]
