# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Detect issue triage
        id: route
        run: node .github/scripts/pullfrog-project.mjs route
      - name: Read primary project
        if: steps.route.outputs.triage == 'true'
        continue-on-error: true
        run: node .github/scripts/pullfrog-project.mjs prepare
        env:
          GH_TOKEN: ${{ secrets.PULLFROG_PROJECTS_TOKEN }}
          PULLFROG_PRIMARY_PROJECT_URL: ${{ vars.PULLFROG_PRIMARY_PROJECT_URL }}
      - name: Run agent
        id: agent
        uses: pullfrog/pullfrog@a86b83b9a671a9fdb156f386cbcc28d665a6b36b # v0
        with:
          prompt: ${{ inputs.prompt }}
          output_schema: ${{ steps.route.outputs.schema }}
        env:
          # add at least one provider API key
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY:
            ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          
          # for Amazon Bedrock (https://docs.pullfrog.com/bedrock)
          # AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_REGION: us-east-1
          # BEDROCK_MODEL_ID: <bedrock-model-id>
          
          # for Google Vertex AI (https://docs.pullfrog.com/vertex)
          # VERTEX_SERVICE_ACCOUNT_JSON: >-
          #   ${{ secrets.VERTEX_SERVICE_ACCOUNT_JSON }}
          # GOOGLE_CLOUD_PROJECT: my-project
          # VERTEX_LOCATION: global
          # VERTEX_MODEL_ID: <vertex-model-id>

          # for any OpenAI-compatible endpoint — LiteLLM, Cloudflare AI Gateway,
          # self-hosted vLLM (https://docs.pullfrog.com/openai-compatible)
          # OPENAI_COMPATIBLE_BASE_URL: https://litellm.example.com/v1
          # OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          # OPENAI_COMPATIBLE_MODEL: <model-id>
          # both limits are required — set them to the real limits of that model
          # OPENAI_COMPATIBLE_CONTEXT: "128000"
          # OPENAI_COMPATIBLE_MAX_OUTPUT: "16384"
      - name: Checkout trusted project writer
        id: project-writer
        if: ${{ !cancelled() && steps.route.outputs.triage == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .pullfrog-project-bridge
          persist-credentials: false
      - name: Apply and verify project triage
        if: ${{ !cancelled() && steps.route.outputs.triage == 'true' && steps.project-writer.outcome == 'success' }}
        run: node .pullfrog-project-bridge/.github/scripts/pullfrog-project.mjs apply
        env:
          GH_TOKEN: ${{ secrets.PULLFROG_PROJECTS_TOKEN }}
          PULLFROG_PRIMARY_PROJECT_URL: ${{ vars.PULLFROG_PRIMARY_PROJECT_URL }}
          TRIAGE_RESULT: ${{ steps.agent.outputs.result }}
