name: Release portable server

on:
  workflow_call:
    inputs:
      frontend_released:
        description: The release merge changed the frontend version
        type: boolean
        required: true
      backend_released:
        description: The release merge changed the backend version
        type: boolean
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        description: Docker Hub access token with write access to both Caelestis image repositories
        required: true

permissions:
  contents: read

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/portable-ci.yml
    with:
      extended: true

  cloudflare:
    uses: ./.github/workflows/portable-cloudflare.yml

  publish:
    needs: [validate, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Prepare artifact versions
        id: version
        run: node .github/scripts/prepare-portable-release.mjs --output-dir release --github-output "$GITHUB_OUTPUT"
      - name: Check for an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          status="$(curl -sS -o /tmp/existing-release.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) cat /tmp/existing-release.json; exit 1 ;;
          esac
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.existing.outputs.exists == 'false'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.existing.outputs.exists == 'false'
        with:
          version: v4.2.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.existing.outputs.exists == 'false'
        with:
          pattern: portable-images-*
          path: tested-images
      - name: Publish immutable images and chart
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.version.outputs.imageTag }}
          CHART_VERSION: ${{ steps.version.outputs.chartVersion }}
          FRONTEND_RELEASED: ${{ inputs.frontend_released }}
          BACKEND_RELEASED: ${{ inputs.backend_released }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          chart_registry="ghcr.io/${GITHUB_REPOSITORY,,}/charts"
          test -n "${DOCKERHUB_TOKEN:?Configure the DOCKERHUB_TOKEN repository secret}"
          echo "$DOCKERHUB_TOKEN" | docker login docker.io --username miacx --password-stdin
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for arch in amd64 arm64; do
            directory="tested-images/portable-images-$arch"
            (cd "$directory" && sha256sum --check SHA256SUMS)
            docker load -i "$directory/images.tar"
            cp "$directory/image-configs.json" "release/$arch-image-configs.json"
            while IFS=$'\t' read -r component source variant_tag dockerhub_repository ghcr_repository; do
              local_image="caelestis-$source:test"
              test "$(docker inspect "$local_image" --format '{{.Architecture}}')" = "$arch"
              test "$(docker inspect "$local_image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
              local_id="$(docker inspect "$local_image" --format '{{.Id}}')"
              jq -e --arg id "$local_id" 'any(.[]; .Id == $id)' "$directory/image-configs.json"
              for image_repository in "$dockerhub_repository" "$ghcr_repository"; do
                image="$image_repository:$variant_tag-$arch"
                if docker manifest inspect "$image" > /tmp/manifest.json 2>/tmp/manifest-error; then
                  test "$(jq -r .config.digest /tmp/manifest.json)" = "$local_id"
                else
                  if ! grep -Eqi 'manifest unknown|no such manifest|not found' /tmp/manifest-error; then cat /tmp/manifest-error; exit 1; fi
                  docker tag "$local_image" "$image"
                  docker push "$image"
                fi
              done
              cp "$directory/$source-sbom.spdx.json" "release/$component-$arch-sbom.spdx.json"
            done < <(jq -r '.[] | [.component, .source, .tag, .registries.dockerhub, .registries.ghcr] | @tsv' release/images.json)
          done
          while IFS=$'\t' read -r component variant_tag dockerhub_repository ghcr_repository; do
            for registry in dockerhub ghcr; do
              case "$registry" in
                dockerhub) image_repository="$dockerhub_repository" ;;
                ghcr) image_repository="$ghcr_repository" ;;
              esac
              image="$image_repository:$variant_tag"
              if docker manifest inspect "$image" > /tmp/manifest.json 2>/tmp/manifest-error; then
                for arch in amd64 arm64; do
                  digest="$(docker buildx imagetools inspect "$image-$arch" --format '{{.Manifest.Digest}}')"
                  jq -e --arg arch "$arch" --arg digest "$digest" 'any(.manifests[]; .platform.architecture == $arch and .digest == $digest)' /tmp/manifest.json
                done
              else
                if ! grep -Eqi 'manifest unknown|no such manifest|not found' /tmp/manifest-error; then cat /tmp/manifest-error; exit 1; fi
                docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
              fi
              digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
              printf '%s@%s\n' "$image_repository" "$digest" > "release/$component-$registry-image.txt"
              if [ "$registry" = dockerhub ]; then
                cp "release/$component-$registry-image.txt" "release/$component-image.txt"
                if [ "$component" = backend ] || [ "$component" = frontend ]; then
                  IMAGE_COMPONENT="$component" IMAGE_DIGEST="$digest" node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const file='deploy/helm/caelestis/values.yaml'; const indent=process.env.IMAGE_COMPONENT==='frontend'?'    ':'  '; writeFileSync(file,readFileSync(file,'utf8').replace(new RegExp('^'+indent+\"digest: ''\", 'm'), indent+'digest: '+process.env.IMAGE_DIGEST));"
                fi
              fi
            done
          done < <(jq -r '.[] | [.component, .tag, .registries.dockerhub, .registries.ghcr] | @tsv' release/images.json)
          while IFS=$'\t' read -r app variant_tag immutable_aliases moving_aliases dockerhub_repository ghcr_repository; do
            case "$app" in
              frontend) released="$FRONTEND_RELEASED" ;;
              backend) released="$BACKEND_RELEASED" ;;
              *) echo "Unknown app: $app"; exit 1 ;;
            esac
            if [ "$released" != true ]; then continue; fi
            for image_repository in "$dockerhub_repository" "$ghcr_repository"; do
              source_image="$image_repository:$variant_tag"
              IFS=',' read -ra aliases <<< "$immutable_aliases"
              for alias in "${aliases[@]}"; do
                image="$image_repository:$alias"
                if docker manifest inspect "$image" > /tmp/manifest.json 2>/tmp/manifest-error; then
                  for arch in amd64 arm64; do
                    digest="$(docker buildx imagetools inspect "$source_image-$arch" --format '{{.Manifest.Digest}}')"
                    jq -e --arg arch "$arch" --arg digest "$digest" 'any(.manifests[]; .platform.architecture == $arch and .digest == $digest)' /tmp/manifest.json
                  done
                else
                  if ! grep -Eqi 'manifest unknown|no such manifest|not found' /tmp/manifest-error; then cat /tmp/manifest-error; exit 1; fi
                  docker buildx imagetools create --tag "$image" "$source_image"
                fi
              done
              IFS=',' read -ra aliases <<< "$moving_aliases"
              for alias in "${aliases[@]}"; do
                docker buildx imagetools create --tag "$image_repository:$alias" "$source_image"
              done
            done
          done < <(jq -r '.[] | [.app, .tag, (.aliases.immutable | join(",")), (.aliases.moving | join(",")), .registries.dockerhub, .registries.ghcr] | @tsv' release/images.json)
          cmp release/backend-image.txt release/backend-bun-image.txt
          cmp release/backend-dockerhub-image.txt release/backend-bun-dockerhub-image.txt
          cmp release/backend-ghcr-image.txt release/backend-bun-ghcr-image.txt
          docker logout ghcr.io
          while IFS=$'\t' read -r app variant_tag immutable_aliases moving_aliases ghcr_repository; do
            tags=("$variant_tag")
            case "$app" in
              frontend) released="$FRONTEND_RELEASED" ;;
              backend) released="$BACKEND_RELEASED" ;;
              *) echo "Unknown app: $app"; exit 1 ;;
            esac
            if [ "$released" = true ]; then
              IFS=',' read -ra aliases <<< "$immutable_aliases,$moving_aliases"
              tags+=("${aliases[@]}")
            fi
            for tag in "${tags[@]}"; do
              if ! docker manifest inspect "$ghcr_repository:$tag" > /dev/null 2>/tmp/ghcr-public-error; then
                cat /tmp/ghcr-public-error
                echo '::error title=GHCR packages are private::Set caelestis-backend and caelestis-frontend package visibility to Public, then rerun this release.'
                exit 1
              fi
            done
          done < <(jq -r '.[] | [.app, .tag, (.aliases.immutable | join(",")), (.aliases.moving | join(",")), .registries.ghcr] | @tsv' release/images.json)
          jq --slurpfile images release/amd64-image-configs.json '. + {runtimes: ($images[0] | map({key: .Config.Labels["cx.mia.caelestis.runtime"], value: .Config.Labels["cx.mia.caelestis.runtime.version"]}) | from_entries)}' release/versions.json > release/versions.tmp
          mv release/versions.tmp release/versions.json
          helm package deploy/helm/caelestis --version "$CHART_VERSION" --app-version "$IMAGE_TAG" --destination release
          chart="release/caelestis-$CHART_VERSION.tgz"
          if helm pull "oci://$chart_registry/caelestis" --version "$CHART_VERSION" --destination /tmp 2>/tmp/chart-error; then
            # Tar timestamps can differ on retries. Compare the extracted chart contents.
            mkdir /tmp/chart-existing /tmp/chart-new
            tar -xzf "/tmp/caelestis-$CHART_VERSION.tgz" -C /tmp/chart-existing
            tar -xzf "$chart" -C /tmp/chart-new
            diff -r /tmp/chart-existing /tmp/chart-new
            cp "/tmp/caelestis-$CHART_VERSION.tgz" "$chart"
          else
            if ! grep -Eqi 'not found|manifest unknown' /tmp/chart-error; then cat /tmp/chart-error; exit 1; fi
            helm push "$chart" "oci://$chart_registry"
          fi
          (cd release && sha256sum *.tgz *-image.txt *.json > SHA256SUMS)
      - name: Publish release manifest and chart archive
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE_TAG: ${{ steps.version.outputs.imageTag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Caelestis server $IMAGE_TAG" --notes-file release/notes.md --latest=false release/*.tgz release/*-image.txt release/*.json release/SHA256SUMS
