name: Release portable server

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: portable-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/portable-ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Prepare artifact versions
        id: version
        run: node .github/scripts/prepare-portable-release.mjs --output-dir release --github-output "$GITHUB_OUTPUT"
      - name: Check for an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          status="$(curl -sS -o /tmp/existing-release.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$status" in
            200) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) cat /tmp/existing-release.json; exit 1 ;;
          esac
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: steps.existing.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.existing.outputs.exists == 'false'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        if: steps.existing.outputs.exists == 'false'
        with:
          version: v4.2.3
      - name: Publish immutable image and chart
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.version.outputs.imageTag }}
          CHART_VERSION: ${{ steps.version.outputs.chartVersion }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="$registry:$IMAGE_TAG"
          if docker manifest inspect "$image" > /tmp/manifest.json 2>/tmp/manifest-error; then
            revision="$(docker buildx imagetools inspect "$image" --format '{{json .Image}}' | jq -r '.["linux/amd64"].config.Labels["org.opencontainers.image.revision"]')"
            test "$revision" = "$GITHUB_SHA"
          else
            if ! grep -Eqi 'manifest unknown|no such manifest|not found' /tmp/manifest-error; then cat /tmp/manifest-error; exit 1; fi
            docker buildx build --platform linux/amd64,linux/arm64 --build-arg CAELESTIS_BUILD_ID="$GITHUB_SHA" --provenance=true --sbom=true --tag "$image" --push .
          fi
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          printf '%s@%s\n' "$registry" "$digest" > release/image.txt
          IMAGE_DIGEST="$digest" node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const file='deploy/helm/caelestis/values.yaml'; writeFileSync(file,readFileSync(file,'utf8').replace(\"  digest: ''\", '  digest: '+process.env.IMAGE_DIGEST));"
          helm package deploy/helm/caelestis --version "$CHART_VERSION" --app-version "$IMAGE_TAG" --destination release
          chart="release/caelestis-$CHART_VERSION.tgz"
          if helm pull "oci://$registry/charts/caelestis" --version "$CHART_VERSION" --destination /tmp 2>/tmp/chart-error; then
            # Tar timestamps can differ on retries. Compare the extracted chart contents.
            mkdir /tmp/chart-existing /tmp/chart-new
            tar -xzf "/tmp/caelestis-$CHART_VERSION.tgz" -C /tmp/chart-existing
            tar -xzf "$chart" -C /tmp/chart-new
            diff -r /tmp/chart-existing /tmp/chart-new
            cp "/tmp/caelestis-$CHART_VERSION.tgz" "$chart"
          else
            if ! grep -Eqi 'not found|manifest unknown' /tmp/chart-error; then cat /tmp/chart-error; exit 1; fi
            helm push "$chart" "oci://$registry/charts"
          fi
          (cd release && sha256sum *.tgz image.txt versions.json > SHA256SUMS)
      - name: Publish release manifest and chart archive
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE_TAG: ${{ steps.version.outputs.imageTag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Caelestis server $IMAGE_TAG" --notes-file release/notes.md --latest=false release/*.tgz release/image.txt release/versions.json release/SHA256SUMS
