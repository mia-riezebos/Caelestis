name: Update download badge

on:
  schedule:
    - cron: '17 4,16 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/statcards.json
      - .github/workflows/update-download-badge.yml

permissions:
  contents: write

concurrency:
  group: update-download-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Caelestis
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: caelestis
          ref: main

      - name: Check out github-statcards
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: asd880921/github-statcards
          ref: 15f8cdd1429eca02761463e5b3af34559acf980b
          path: github-statcards

      - name: Generate download badge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp caelestis/.github/statcards.json github-statcards/config.json
          node github-statcards/scripts/update-statcards.mjs

      - name: Commit updated badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          badge_path='badges/userscript-downloads.json'
          generated_path="github-statcards/$badge_path"
          current_path="caelestis/$badge_path"

          if cmp -s "$generated_path" "$current_path"; then
            echo 'No badge changes.'
            exit 0
          fi

          head_oid=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          contents=$(base64 -w 0 "$generated_path")
          gh api graphql \
            -f query='mutation($repository: String!, $branch: String!, $expectedHeadOid: GitObjectID!, $contents: Base64String!) {
              createCommitOnBranch(input: {
                branch: { repositoryNameWithOwner: $repository, branchName: $branch }
                message: { headline: "chore: update download badge" }
                expectedHeadOid: $expectedHeadOid
                fileChanges: { additions: [{ path: "badges/userscript-downloads.json", contents: $contents }] }
              }) {
                commit { oid }
              }
            }' \
            -f repository="$GITHUB_REPOSITORY" \
            -f branch=main \
            -f expectedHeadOid="$head_oid" \
            -f contents="$contents"
