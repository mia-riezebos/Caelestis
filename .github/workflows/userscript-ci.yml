name: Userscript CI

on:
  pull_request:
    paths:
      - apps/userscript/**
      - packages/shared/**
      - .changeset/**
      - .github/scripts/prepare-userscript-release.mjs
      - .github/scripts/prepare-userscript-release.test.mjs
      - .github/workflows/userscript-ci.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  push:
    branches:
      - main
    paths:
      - apps/userscript/**
      - packages/shared/**
      - .changeset/**
      - .github/scripts/prepare-userscript-release.mjs
      - .github/scripts/prepare-userscript-release.test.mjs
      - .github/workflows/userscript-ci.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: userscript-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test userscript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tooling
        run: pnpm test:release

      - name: Build userscript and dependencies
        run: pnpm --filter @caelestis/userscript... build

      - name: Typecheck userscript and dependencies
        run: pnpm --filter @caelestis/userscript... check

      - name: Test userscript and dependencies
        run: pnpm --filter @caelestis/userscript... test

      - name: Upload userscript build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caelestis-userscript-${{ github.sha }}
          path: apps/userscript/dist/wplace-template-server.user.js
          if-no-files-found: error
          retention-days: 14
