name: App release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      retry_userscript_announcement:
        description: Retry the current userscript version's verified Discord announcement
        type: boolean
        default: false
      retry_frontend_announcement:
        description: Retry the current frontend version's Discord announcement
        type: boolean
        default: false

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  version:
    name: Version apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.release.outputs.release }}
      frontend_released: ${{ steps.released.outputs.frontend }}
      backend_released: ${{ steps.released.outputs.backend }}
      has_userscript_changesets: ${{ steps.pending.outputs.userscript }}
      has_frontend_changesets: ${{ steps.pending.outputs.frontend }}
      has_backend_changesets: ${{ steps.pending.outputs.backend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tooling
        run: pnpm test:release

      - name: Identify a merged Changesets pull request
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --paginate --slurp | node .github/scripts/release-merge.mjs "$GITHUB_SHA" "$GITHUB_REPOSITORY")"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Find pending app changesets
        id: pending
        run: |
          status="$RUNNER_TEMP/changeset-status.json"
          pnpm changeset status --output="$status"
          for app in userscript frontend backend; do
            if jq -e --arg name "@caelestis/$app" '.releases | any(.name == $name)' "$status" >/dev/null; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Find apps changed by the merged release
        id: released
        if: steps.release.outputs.release == 'true'
        run: |
          for app in frontend backend; do
            if git diff --quiet "$GITHUB_SHA^1" "$GITHUB_SHA" -- "apps/$app/package.json"; then
              echo "$app=false" >> "$GITHUB_OUTPUT"
            else
              echo "$app=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Open or update the app release pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: pnpm release:version
          commit-message: "chore(release): version apps"
          pr-title: "chore(release): version apps"
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

  deploy:
    name: Deploy approved release
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      release_sha: ${{ github.sha }}
    secrets: inherit
    permissions:
      contents: read

  portable:
    name: Release approved portable server
    needs: version
    if: >-
      needs.version.outputs.release == 'true' &&
      needs.version.outputs.has_frontend_changesets == 'false' &&
      needs.version.outputs.has_backend_changesets == 'false'
    uses: ./.github/workflows/portable-release.yml
    with:
      frontend_released: ${{ needs.version.outputs.frontend_released == 'true' }}
      backend_released: ${{ needs.version.outputs.backend_released == 'true' }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      packages: write

  userscript:
    name: Release userscript
    needs: [version, deploy]
    if: >-
      !cancelled() &&
      ((needs.deploy.result == 'success' &&
      needs.version.outputs.has_userscript_changesets == 'false') ||
      inputs.retry_userscript_announcement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript and dependencies
        run: pnpm --filter @caelestis/userscript... build

      - name: Typecheck userscript and dependencies
        run: pnpm --filter @caelestis/userscript... check

      - name: Test userscript and dependencies
        run: pnpm --filter @caelestis/userscript... test

      - name: Prepare userscript release
        id: userscript
        run: >-
          node .github/scripts/prepare-userscript-release.mjs
          --output-dir "${{ runner.temp }}/userscript-release"
          --github-output "$GITHUB_OUTPUT"

      - name: Check whether this userscript version already exists
        id: userscript-existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.userscript.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "matches_sha=true" >> "$GITHUB_OUTPUT"
            else
              echo "matches_sha=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "matches_sha=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require an existing userscript release for announcement retry
        if: inputs.retry_userscript_announcement
        env:
          EXISTS: ${{ steps.userscript-existing.outputs.exists }}
        run: test "$EXISTS" = true

      - name: Create userscript GitHub release
        if: needs.deploy.result == 'success' && steps.userscript-existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.userscript.outputs.tag }}
          VERSION: ${{ steps.userscript.outputs.version }}
          NOTES: ${{ steps.userscript.outputs.notesPath }}
          STABLE: ${{ steps.userscript.outputs.stablePath }}
          VERSIONED: ${{ steps.userscript.outputs.versionedPath }}
          CHECKSUMS: ${{ steps.userscript.outputs.checksumPath }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Caelestis userscript v$VERSION" \
            --notes-file "$NOTES" \
            --latest \
            "$STABLE" "$VERSIONED" "$CHECKSUMS"

      - name: Verify published installers
        if: >-
          steps.userscript-existing.outputs.exists == 'false' ||
          (steps.userscript-existing.outputs.matches_sha == 'true' &&
          github.run_attempt > 1) ||
          inputs.retry_userscript_announcement
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.userscript.outputs.tag }}
          SHA256: ${{ steps.userscript.outputs.sha256 }}
        run: |
          download="$(mktemp -d)"
          gh release download "$TAG" --dir "$download"
          test "$(sha256sum "$download/caelestis.user.js" | cut -d ' ' -f 1)" = "$SHA256"
          test "$(sha256sum "$download/caelestis-v"*.user.js | cut -d ' ' -f 1)" = "$SHA256"
          (cd "$download" && sha256sum --check SHA256SUMS)

      - name: Announce userscript release in Discord
        if: >-
          steps.userscript-existing.outputs.exists == 'false' ||
          (steps.userscript-existing.outputs.matches_sha == 'true' &&
          github.run_attempt > 1) ||
          inputs.retry_userscript_announcement
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          NOTES: ${{ steps.userscript.outputs.notesPath }}
          TAG: ${{ steps.userscript.outputs.tag }}
          VERSION: ${{ steps.userscript.outputs.version }}
        run: >-
          node .github/scripts/post-release.mjs
          --app userscript
          --version "$VERSION"
          --tag "$TAG"
          --notes-file "$NOTES"
          --repository "$GITHUB_REPOSITORY"

  deployed-apps:
    name: Tag deployed frontend and backend
    needs: [version, deploy]
    if: >-
      !cancelled() &&
      ((needs.deploy.result == 'success' &&
      (needs.version.outputs.has_frontend_changesets == 'false' ||
      needs.version.outputs.has_backend_changesets == 'false')) ||
      inputs.retry_frontend_announcement)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare frontend version
        id: frontend
        if: >-
          needs.version.outputs.has_frontend_changesets == 'false' ||
          inputs.retry_frontend_announcement
        run: >-
          node .github/scripts/prepare-app-release.mjs
          --app frontend
          --output-dir "${{ runner.temp }}/frontend-release"
          --github-output "$GITHUB_OUTPUT"

      - name: Prepare backend version
        id: backend
        if: needs.version.outputs.has_backend_changesets == 'false'
        run: >-
          node .github/scripts/prepare-app-release.mjs
          --app backend
          --output-dir "${{ runner.temp }}/backend-release"
          --github-output "$GITHUB_OUTPUT"

      - name: Check whether this frontend tag already exists
        id: frontend-tag
        if: >-
          needs.version.outputs.has_frontend_changesets == 'false' ||
          inputs.retry_frontend_announcement
        env:
          TAG: ${{ steps.frontend.outputs.tag }}
        run: |
          if target="$(git rev-list -n 1 "refs/tags/$TAG" 2>/dev/null)" && [ -n "$target" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "matches_sha=true" >> "$GITHUB_OUTPUT"
            else
              echo "matches_sha=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "matches_sha=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require an existing frontend tag for announcement retry
        if: inputs.retry_frontend_announcement
        env:
          EXISTS: ${{ steps.frontend-tag.outputs.exists }}
        run: test "$EXISTS" = true

      - name: Check whether this backend tag already exists
        id: backend-tag
        if: needs.version.outputs.has_backend_changesets == 'false'
        env:
          TAG: ${{ steps.backend.outputs.tag }}
        run: |
          if git rev-list -n 1 "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create frontend version tag
        if: >-
          needs.deploy.result == 'success' &&
          (needs.version.outputs.has_frontend_changesets == 'false' ||
          inputs.retry_frontend_announcement) &&
          steps.frontend-tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.frontend.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create backend version tag
        if: >-
          needs.deploy.result == 'success' &&
          needs.version.outputs.has_backend_changesets == 'false' &&
          steps.backend-tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.backend.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Announce frontend release in Discord
        if: >-
          (needs.version.outputs.has_frontend_changesets == 'false' ||
          inputs.retry_frontend_announcement) &&
          (steps.frontend-tag.outputs.exists == 'false' ||
          (steps.frontend-tag.outputs.matches_sha == 'true' &&
          github.run_attempt > 1) ||
          inputs.retry_frontend_announcement)
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          NOTES: ${{ steps.frontend.outputs.notesPath }}
          TAG: ${{ steps.frontend.outputs.tag }}
          VERSION: ${{ steps.frontend.outputs.version }}
        run: >-
          node .github/scripts/post-release.mjs
          --app frontend
          --version "$VERSION"
          --tag "$TAG"
          --notes-file "$NOTES"
          --repository "$GITHUB_REPOSITORY"
