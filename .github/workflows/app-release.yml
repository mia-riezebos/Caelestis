name: App release

on:
  push:
    branches:
      - main
    paths:
      - apps/backend/**
      - apps/frontend/**
      - apps/userscript/**
      - packages/**
      - .changeset/**
      - .github/scripts/*release*.mjs
      - .github/workflows/app-release.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:
    inputs:
      retry_userscript_announcement:
        description: Retry the current userscript version's verified Discord announcement
        type: boolean
        default: false
      retry_frontend_announcement:
        description: Retry the current frontend version's Discord announcement
        type: boolean
        default: false

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  version:
    name: Version apps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tooling
        run: pnpm test:release

      - name: Open or update the app release pull request
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
        with:
          version-script: pnpm release:version
          commit-message: "chore(release): version apps"
          pr-title: "chore(release): version apps"
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

  userscript:
    name: Release userscript
    needs: version
    if: >-
      needs.version.outputs.has_changesets == 'false' ||
      inputs.retry_userscript_announcement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build userscript and dependencies
        run: pnpm --filter @caelestis/userscript... build

      - name: Typecheck userscript and dependencies
        run: pnpm --filter @caelestis/userscript... check

      - name: Test userscript and dependencies
        run: pnpm --filter @caelestis/userscript... test

      - name: Prepare userscript release
        id: userscript
        run: >-
          node .github/scripts/prepare-userscript-release.mjs
          --output-dir "${{ runner.temp }}/userscript-release"
          --github-output "$GITHUB_OUTPUT"

      - name: Check whether this userscript version already exists
        id: userscript-existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.userscript.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "matches_sha=true" >> "$GITHUB_OUTPUT"
            else
              echo "matches_sha=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "matches_sha=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create userscript GitHub release
        if: steps.userscript-existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.userscript.outputs.tag }}
          VERSION: ${{ steps.userscript.outputs.version }}
          NOTES: ${{ steps.userscript.outputs.notesPath }}
          STABLE: ${{ steps.userscript.outputs.stablePath }}
          VERSIONED: ${{ steps.userscript.outputs.versionedPath }}
          CHECKSUMS: ${{ steps.userscript.outputs.checksumPath }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Caelestis userscript v$VERSION" \
            --notes-file "$NOTES" \
            --latest \
            "$STABLE" "$VERSIONED" "$CHECKSUMS"

      - name: Verify published installers
        if: >-
          steps.userscript-existing.outputs.exists == 'false' ||
          (steps.userscript-existing.outputs.matches_sha == 'true' &&
          github.run_attempt > 1) ||
          inputs.retry_userscript_announcement
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.userscript.outputs.tag }}
          SHA256: ${{ steps.userscript.outputs.sha256 }}
        run: |
          download="$(mktemp -d)"
          gh release download "$TAG" --dir "$download"
          test "$(sha256sum "$download/caelestis.user.js" | cut -d ' ' -f 1)" = "$SHA256"
          test "$(sha256sum "$download/caelestis-v"*.user.js | cut -d ' ' -f 1)" = "$SHA256"
          (cd "$download" && sha256sum --check SHA256SUMS)

      - name: Announce userscript release in Discord
        if: >-
          steps.userscript-existing.outputs.exists == 'false' ||
          (steps.userscript-existing.outputs.matches_sha == 'true' &&
          github.run_attempt > 1) ||
          inputs.retry_userscript_announcement
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          NOTES: ${{ steps.userscript.outputs.notesPath }}
          TAG: ${{ steps.userscript.outputs.tag }}
          VERSION: ${{ steps.userscript.outputs.version }}
        run: >-
          node .github/scripts/post-release.mjs
          --app userscript
          --version "$VERSION"
          --tag "$TAG"
          --notes-file "$NOTES"
          --repository "$GITHUB_REPOSITORY"

  deployed-apps:
    name: Release deployed frontend and backend
    needs: version
    if: >-
      needs.version.outputs.has_changesets == 'false' ||
      inputs.retry_frontend_announcement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Wait for this commit's production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            run_id="$(gh run list --workflow deploy.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              gh run watch "$run_id" --exit-status
              exit 0
            fi
            sleep 10
          done
          echo "No production deployment run found for $GITHUB_SHA" >&2
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare frontend release
        id: frontend
        run: >-
          node .github/scripts/prepare-app-release.mjs
          --app frontend
          --output-dir "${{ runner.temp }}/frontend-release"
          --github-output "$GITHUB_OUTPUT"

      - name: Prepare backend release
        id: backend
        run: >-
          node .github/scripts/prepare-app-release.mjs
          --app backend
          --output-dir "${{ runner.temp }}/backend-release"
          --github-output "$GITHUB_OUTPUT"

      - name: Check whether this frontend version already exists
        id: frontend-existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.frontend.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
            if [ "$target" = "$GITHUB_SHA" ]; then
              echo "matches_sha=true" >> "$GITHUB_OUTPUT"
            else
              echo "matches_sha=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "matches_sha=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether this backend version already exists
        id: backend-existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.backend.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create frontend GitHub release
        if: steps.frontend-existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.frontend.outputs.tag }}
          VERSION: ${{ steps.frontend.outputs.version }}
          NOTES: ${{ steps.frontend.outputs.notesPath }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Caelestis frontend v$VERSION" \
            --notes-file "$NOTES" \
            --latest=false

      - name: Create backend GitHub release
        if: steps.backend-existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.backend.outputs.tag }}
          VERSION: ${{ steps.backend.outputs.version }}
          NOTES: ${{ steps.backend.outputs.notesPath }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Caelestis backend v$VERSION" \
            --notes-file "$NOTES" \
            --latest=false

      - name: Announce frontend release in Discord
        if: >-
          steps.frontend-existing.outputs.exists == 'false' ||
          (steps.frontend-existing.outputs.matches_sha == 'true' &&
          github.run_attempt > 1) ||
          inputs.retry_frontend_announcement
        env:
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_FRONTEND_RELEASE_WEBHOOK_URL }}
          NOTES: ${{ steps.frontend.outputs.notesPath }}
          TAG: ${{ steps.frontend.outputs.tag }}
          VERSION: ${{ steps.frontend.outputs.version }}
        run: >-
          node .github/scripts/post-release.mjs
          --app frontend
          --version "$VERSION"
          --tag "$TAG"
          --notes-file "$NOTES"
          --repository "$GITHUB_REPOSITORY"
