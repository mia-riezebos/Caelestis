name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 492214885e7a580ccc1d141dfdb4dc5f
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Check code
        run: |
          pnpm lint
          pnpm check
          pnpm test
          pnpm build

      - name: Apply backend database migrations
        run: pnpm --dir apps/backend exec wrangler d1 migrations apply DB --remote

      - name: Deploy backend
        run: |
          userscript_build_id="$(node -p "require('./apps/userscript/package.json').version")"
          pnpm --dir apps/backend exec wrangler deploy \
            --var "USERSCRIPT_BUILD_ID:$userscript_build_id" \
            --var "FRONTEND_BUILD_ID:$GITHUB_SHA"

      - name: Deploy frontend
        run: pnpm --dir apps/frontend exec wrangler deploy
