name: Deploy

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact merged Changesets commit to deploy
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 492214885e7a580ccc1d141dfdb4dc5f
      CAELESTIS_BUILD_ID: ${{ inputs.release_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check D1 access
        run: pnpm --dir apps/backend exec wrangler d1 migrations list DB --remote

      - name: Check code
        run: |
          pnpm lint
          pnpm check
          pnpm test --concurrency=1
          pnpm build

      - name: Apply backend database migrations
        run: pnpm --dir apps/backend exec wrangler d1 migrations apply DB --remote

      # The new frontend works against the old open backend. Deploy it first so a later backend
      # failure leaves reads open, and a frontend failure never closes reads for the old frontend.
      - name: Deploy frontend
        run: pnpm --dir apps/frontend exec wrangler deploy

      - name: Deploy backend
        run: |
          userscript_versions_json="$(node .github/scripts/userscript-metric-versions.mjs)"
          pnpm --dir apps/backend exec wrangler deploy \
            --define "__CAELESTIS_DEPLOYMENT_VERSION__:\"$CAELESTIS_BUILD_ID\"" \
            --define "__CAELESTIS_USERSCRIPT_VERSIONS__:$userscript_versions_json"
