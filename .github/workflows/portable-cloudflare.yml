name: Cloudflare stack acceptance

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '47 23 * * *'

permissions:
  contents: read

concurrency:
  group: caelestis-cloudflare-stack-tests
  cancel-in-progress: false

jobs:
  cloudflare:
    # Never expose test-account credentials to pull request code or an arbitrary dispatch ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: stack-tests
    env:
      CLOUDFLARE_TEST_ACCOUNT_ID: ${{ vars.CLOUDFLARE_TEST_ACCOUNT_ID }}
      CLOUDFLARE_TEST_API_TOKEN: ${{ secrets.CLOUDFLARE_TEST_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check one-time setup
        run: |
          test -n "$CLOUDFLARE_TEST_ACCOUNT_ID" && test -n "$CLOUDFLARE_TEST_API_TOKEN" || {
            echo 'Complete the Cloudflare setup in docs/stack-testing.md'; exit 1;
          }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @caelestis/frontend... build
      - name: Provision, test, and remove dedicated resources
        run: node scripts/test-cloudflare-remote.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloudflare-remote-results
          path: test-results/
          retention-days: 7
